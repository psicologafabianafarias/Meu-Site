Sobre Mim
Sou psicóloga clínica e acredito que a terapia é um espaço de escuta, cuidado e construção. Meu trabalho é ajudar você a compreender o que sente e a encontrar caminhos possíveis para o dia a dia, com ética, sigilo e respeito à sua história.


Meu olhar é fundamentado na Abordagem Centrada na Pessoa (ACP), na Fenomenologia Existencial e na Logoterapia de Viktor Frankl, valorizando a liberdade de escolha, o autoconhecimento e a busca genuína por sentido.
Graduação
Psicologia - Universidade Anhanguera (2025)
Especializações
Pós-Graduação Lato Sensu em Abordagem Centrada na Pessoa (ACP) e em Políticas Públicas com Ênfase em Saúde da Família. Capacitação em Prevenção ao Suicídio (UFSC).
