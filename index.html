<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicóloga Fabiana Farias | CRP 06/234608</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #FDF9F8;
            --header-rose: #F6E4E1;
            --card-bg: #F9EFED;
            --primary-color: #6D4347;
            --rose-burnt: #B57379;
            --rose-hover: #9C5B61;
            --text-color: #4F3A3C;
            --text-light: #82696B;
            --whatsapp-green: #25D366;
            --whatsapp-hover: #1EBE5D;
            --white: #FFFFFF;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .serif {
            font-family: 'Cormorant Garamond', serif;
            color: var(--primary-color);
        }

        header {
            background-color: var(--header-rose);
            border-bottom: 1px solid rgba(181, 115, 121, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 14px 5%;
            box-shadow: 0 2px 15px rgba(109, 67, 71, 0.06);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-area img {
            height: 52px;
            width: 52px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--rose-burnt);
            background-color: var(--white);
        }

        .logo-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.55rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 24px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--primary-color);
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--rose-burnt);
        }

        .btn-nav {
            background-color: var(--rose-burnt);
            color: var(--white) !important;
            padding: 10px 22px;
            border-radius: 50px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(181, 115, 121, 0.3);
        }

        .btn-nav:hover {
            background-color: var(--rose-hover);
            transform: translateY(-2px);
        }

        .hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 65px 5% 75px;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 50px;
            align-items: center;
        }

        .subtitle-tag {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--rose-burnt);
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }

        .hero h1 {
            font-size: 3.6rem;
            font-weight: 600;
            line-height: 1.1;
            margin-bottom: 12px;
        }

        .crp-badge {
            font-size: 1.05rem;
            color: var(--text-light);
            font-style: italic;
            border-left: 3px solid var(--rose-burnt);
            padding-left: 14px;
            margin-bottom: 24px;
        }

        .quote-box {
            font-style: italic;
            color: var(--text-color);
            font-size: 1.05rem;
            margin-bottom: 28px;
            padding-left: 16px;
            border-left: 2px solid rgba(181, 115, 121, 0.4);
        }

        .pills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 32px;
        }

        .pill {
            background-color: var(--card-bg);
            color: var(--primary-color);
            border: 1px solid rgba(181, 115, 121, 0.3);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--whatsapp-green);
            color: var(--white);
            text-decoration: none;
            padding: 15px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.28);
            transition: var(--transition);
        }

        .btn-whatsapp:hover {
            background-color: var(--whatsapp-hover);
            transform: translateY(-2px);
        }

        .hero-image-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .hero-image-wrapper::before {
            content: '';
            position: absolute;
            top: -15px;
            right: -15px;
            width: 100%;
            height: 100%;
            border: 2px solid var(--rose-burnt);
            border-radius: 24px;
            z-index: 0;
            opacity: 0.5;
        }

        .hero-image {
            width: 100%;
            max-width: 420px;
            height: 480px;
            object-fit: cover;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(109, 67, 71, 0.15);
            position: relative;
            z-index: 1;
            background-color: var(--card-bg);
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo-area">
                <span class="logo-text">Fabiana Farias</span>
            </a>
            <nav>
                <ul>
                    <li><a href="https://wa.me" target="_blank" class="btn-nav">Fale Comigo</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="hero">
        <div>
            <span class="subtitle-tag">Psicologia Clínica</span>
            <h1>Fabiana Farias</h1>
            <div class="crp-badge">CRP 06/234608</div>
            <p class="quote-box">"Cuidando do seu bem-estar emocional e auxiliando na sua jornada de autoconhecimento."</p>
            <div class="pills-container">
                <span class="pill">Psicoterapia</span>
                <span class="pill">Atendimento Online</span>
                <span class="pill">Adultos e Adolescentes</span>
            </div>
            <a href="https://wa.me" target="_blank" class="btn-whatsapp">Agendar Consulta</a>
        </div>
        <div class="hero-image-wrapper">
            <!-- Caso tenha uma foto de perfil, substitua o link abaixo pelo nome exato do arquivo da imagem -->
            <img src="Imagem do WhatsApp 2026-11-16 às 16.30.48_10672e3a.jpg" alt="Psicóloga Fabiana Farias" class="hero-image">
        </div>
    </main>

</body>
</html>
